[project]
name = "cconnect-backend"
version = "1.3.1"
description = "Remote bridge between the CConnect client and Claude Code"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.136.0",
    "uvicorn[standard]>=0.45.0",
    "pydantic>=2.13.3",
    "loguru>=0.7.3",
    "python-dotenv>=1.0.0",
    "slowapi>=0.1.9",
    "claude-agent-sdk>=0.2.87",
    "qrcode>=7.4.2",
    "sqlalchemy>=2.0.0",
    "pillow>=10.0.0",
    "psutil>=5.9.0",
    "nvidia-ml-py>=12.0.0",
    "py7zr>=1.0.0",
    "rarfile>=4.2",
    "watchdog>=4.0.0",
]

[tool.cconnect]
supported-app = ">=1.3.0"
supported-cli = ">=2.1.197"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[tool.setuptools.packages.find]
include = ["core*", "routers*", "schemas*", "middleware*", "services*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"
