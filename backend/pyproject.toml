[project]
name = "cconnect"
dynamic = ["version"]
description = "Remote bridge between the CConnect client and Claude Code"
readme = { text = """
CConnect drives Claude Code running on your PC from an Android app, a desktop app
for Windows, Linux and macOS, or any browser.

This is the backend: install it and run `cconnect`. The apps, the docs and the
install one-liners are at https://cconnect.dev
""", content-type = "text/markdown" }
license = "MIT"
authors = [{ name = "jahirtrap" }]
keywords = ["claude", "claude-code", "anthropic", "remote", "mobile"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.136.0",
    "uvicorn[standard]>=0.45.0",
    "pydantic>=2.13.3",
    "loguru>=0.7.3",
    "orjson>=3.12.0",
    "python-dotenv>=1.0.0",
    "slowapi>=0.1.9",
    "httpx>=0.28.0",
    "claude-agent-sdk>=0.2.148",
    "qrcode>=7.4.2",
    "sqlalchemy>=2.0.0",
    "pillow>=10.0.0",
    "psutil>=5.9.0",
    "nvidia-ml-py>=12.0.0",
    "py7zr>=1.0.0",
    "rarfile>=4.2",
    "watchdog>=4.0.0",
    "pywinpty>=2.0.13; sys_platform == 'win32'",
    "ptyprocess>=0.7.0; sys_platform != 'win32'",
]

[project.urls]
Homepage = "https://cconnect.dev"
Repository = "https://github.com/jahirxtrap/cconnect"

[project.scripts]
cconnect = "core.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[tool.setuptools.dynamic]
version = { attr = "core.release.VERSION" }

[tool.setuptools.packages.find]
include = ["core*", "routers*", "schemas*", "middleware*", "services*", "mcps*"]

[tool.setuptools.package-data]
core = ["prompts/*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"
