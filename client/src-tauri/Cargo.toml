[package]
name = "cconnect"
version = "2.0.1"
description = "CConnect"
authors = ["jahirtrap"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "cconnect_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
adblock = { version = "0.13", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
base64 = "0.23.1"
regex = "1"
russh = { version = "0.62", default-features = false, features = ["flate2", "ring"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "unstable"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "io-util"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_System_Com"] }
windows-core = "0.61"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security_Cryptography",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
adblock = { version = "0.13", default-features = false, features = ["content-blocking"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSBitmapImageRep", "NSImage", "NSImageRep"] }
objc2-foundation = { version = "0.3", features = [
    "NSArray",
    "NSData",
    "NSDictionary",
    "NSEnumerator",
    "NSError",
    "NSKeyValueCoding",
    "NSSet",
    "NSString",
    "NSURL",
    "NSUUID",
] }
objc2-web-kit = { version = "0.3", features = [
    "block2",
    "objc2-app-kit",
    "WKContentRuleList",
    "WKContentRuleListStore",
    "WKNavigation",
    "WKSnapshotConfiguration",
    "WKUserContentController",
    "WKWebView",
    "WKWebViewConfiguration",
    "WKWebsiteDataRecord",
    "WKWebsiteDataStore",
] }

[target.'cfg(target_os = "linux")'.dependencies]
cairo-rs = { version = "0.18", features = ["png"] }
webkit2gtk = { version = "2.0", features = ["v2_40"] }
webkit2gtk-sys = { version = "2.0", features = ["v2_24"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
discord-rich-presence = "0.2"
tauri-plugin-drag = "2.1.1"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2.4.5"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
