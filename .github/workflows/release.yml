name: Release

on:
  push:
    tags: ['*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Build installers
        env:
          GOOGLE_CLIENT_ID_DESKTOP: ${{ secrets.GOOGLE_CLIENT_ID_DESKTOP }}
          GOOGLE_CLIENT_SECRET_DESKTOP: ${{ secrets.GOOGLE_CLIENT_SECRET_DESKTOP }}
        run: |
          npm ci
          if [ "$RUNNER_OS" = macOS ]; then
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
            npm run tauri build -- --target universal-apple-darwin
            echo "BUNDLE_DIR=src-tauri/target/universal-apple-darwin/release/bundle" >> "$GITHUB_ENV"
          else
            npm run tauri build
            echo "BUNDLE_DIR=src-tauri/target/release/bundle" >> "$GITHUB_ENV"
          fi

      - name: Normalize asset names
        run: |
          version="${GITHUB_REF_NAME}"
          cd "$BUNDLE_DIR"
          for file in nsis/*.exe msi/*.msi deb/*.deb rpm/*.rpm appimage/*.AppImage dmg/*.dmg; do
            [ -e "$file" ] || continue
            mv "$file" "$(dirname "$file")/cconnect-tauri-$version.${file##*.}"
          done

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          body_path: CHANGELOG.md

      - name: Upload the installers
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          for file in $BUNDLE_DIR/{nsis/*.exe,msi/*.msi,deb/*.deb,rpm/*.rpm,appimage/*.AppImage,dmg/*.dmg}; do
            for attempt in 1 2 3; do
              gh release upload "$GITHUB_REF_NAME" "$file" --clobber && break
              [ "$attempt" = 3 ] && exit 1
              sleep 20
            done
          done

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android NDK
        run: sdkmanager --install "ndk;27.2.12479018"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Build APK
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
          GOOGLE_CLIENT_ID_DESKTOP: ${{ secrets.GOOGLE_CLIENT_ID_DESKTOP }}
          GOOGLE_CLIENT_SECRET_DESKTOP: ${{ secrets.GOOGLE_CLIENT_SECRET_DESKTOP }}
        run: |
          npm ci
          npm run tauri android build -- --apk --target aarch64

      - name: Sign with the release keystore
        run: |
          echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          unsigned=$(ls src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk | head -1)
          "$build_tools/zipalign" -p -f 4 "$unsigned" aligned.apk
          "$build_tools/apksigner" sign \
            --ks keystore.jks \
            --ks-pass "pass:${{ secrets.SIGNING_STORE_PASSWORD }}" \
            --ks-key-alias "${{ secrets.SIGNING_KEY_ALIAS }}" \
            --key-pass "pass:${{ secrets.SIGNING_KEY_PASSWORD }}" \
            --out "cconnect-tauri-${GITHUB_REF_NAME}.apk" aligned.apk

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          body_path: CHANGELOG.md

      - name: Upload the APK
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3; do
            gh release upload "$GITHUB_REF_NAME" "cconnect-tauri-${GITHUB_REF_NAME}.apk" --clobber && break
            [ "$attempt" = 3 ] && exit 1
            sleep 20
          done

  pypi:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.1.0

      - name: Look up the published version
        id: backend
        run: |
          version=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' backend/core/release.py)
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/cconnect/$version/json")
          if [ "$code" = 200 ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the backend
        if: steps.backend.outputs.published == 'false'
        working-directory: backend
        run: uv build

      - name: Publish to PyPI
        if: steps.backend.outputs.published == 'false'
        working-directory: backend
        run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/cconnect/

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Build web bundle
        working-directory: client
        env:
          GOOGLE_CLIENT_ID_WEB: ${{ secrets.GOOGLE_CLIENT_ID_WEB }}
        run: |
          npm ci
          npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy client/dist --project-name=cconnect --branch=main --commit-dirty=true
